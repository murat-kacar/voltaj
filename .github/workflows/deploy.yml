name: CI/CD Pipeline (Staging & Production)

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI: Automated Tests & Quality Checks
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # the tests that need a real database (PostgresApiFixture) run against this server
      VOLTFLOW_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET Dependencies
        run: dotnet restore Voltflow.sln

      - name: Build .NET Solution
        run: dotnet build Voltflow.sln --no-restore --configuration Release --nologo

      - name: Run .NET Tests
        run: dotnet test Voltflow.sln --no-build --configuration Release --nologo

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend (Typecheck & Bundle)
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2. Package: Build & Push Multi-Container Images to GHCR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      target_env: ${{ steps.vars.outputs.env_name }}
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment & Tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=production" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "tag=staging" >> $GITHUB_OUTPUT
            echo "env_name=staging" >> $GITHUB_OUTPUT
          fi
          # Docker registries require lowercase repository names
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$LOWER_OWNER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push API Image
      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Voltflow.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/voltflow-api:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/voltflow-api:${{ github.sha }}

      # Build & Push Worker Image
      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Voltflow.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/voltflow-worker:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/voltflow-worker:${{ github.sha }}

      # Build & Push Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.registry }}/voltflow-frontend:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.registry }}/voltflow-frontend:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 2b. Security: Trivy vulnerability scan on built images (HIGH/CRITICAL)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Image Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [voltflow-api, voltflow-worker, voltflow-frontend]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy scan — ${{ matrix.image }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.registry }}/${{ matrix.image }}:${{ needs.build-and-push.outputs.image_tag }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 3. CD: Deploy to Target Ubuntu VPS via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Target VPS
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.target_env }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo mkdir -p /opt/voltflow
            sudo chown -R $USER:$USER /opt/voltflow

      - name: Transfer Deployment Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.deploy.yml"
          target: "/opt/voltflow/"

      - name: Execute Pull and Rolling Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TARGET_ENV: ${{ needs.build-and-push.outputs.target_env }}
          DB_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.VOLT_JWT_KEY }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          REDIS_PASS: ${{ secrets.REDIS_PASSWORD }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: REGISTRY,TAG,TARGET_ENV,DB_PASS,JWT_KEY,SEED_ADMIN_EMAIL,SEED_ADMIN_PASSWORD,REDIS_PASS,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            cd /opt/voltflow
            cp docker-compose.deploy.yml docker-compose.yml

            # 1. Log in to GHCR on the VPS so private packages can be pulled
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # 2. Safely generate .env file with secrets on the VPS
            ENV_TYPE="Staging"
            if [ "$TARGET_ENV" = "production" ]; then
              ENV_TYPE="Production"
            fi

            cat <<EOF | sed -e 's/^[[:space:]]*//' > .env
            IMAGE_REGISTRY=$REGISTRY
            IMAGE_TAG=$TAG
            APP_ENVIRONMENT=$ENV_TYPE
            POSTGRES_DB=voltflow
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=$DB_PASS
            VOLT_JWT_KEY=$JWT_KEY
            SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL
            SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD
            REDIS_PASSWORD=$REDIS_PASS
            EOF
            chmod 600 .env

            # 3. Pull latest images from GHCR
            docker compose pull

            # 4. Zero-downtime rolling recreation
            docker compose up -d --remove-orphans

            # 5. Clean up dangling images to keep VPS disk healthy
            docker image prune -af --filter "until=72h"

            # 6. Verify containers status
            docker compose ps
