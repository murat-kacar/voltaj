# /etc/nginx/sites-available/voltflow-production.conf
# Production configuration for https://terminalworks.uk

limit_req_zone $binary_remote_addr zone=prod_api_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name terminalworks.uk www.terminalworks.uk;

    client_max_body_size 25M;

    # 1. Frontend (React / Vite Container on port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Backend API (.NET API Container on port 8080)
    location /api/ {
        limit_req zone=prod_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Health Check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
